name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint & format
        run: bunx @biomejs/biome check packages/ tests/ scripts/

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Select binary smoke inputs
        id: binary_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            packages/cli/ packages/core/ packages/plugins/injective/ tests/ \
            scripts/build-binary.js .github/workflows/ package.json bun.lock \
            '**/package.json' 'tsconfig*.json' 'vitest.config.*'; then
            echo 'affected=false' >> "$GITHUB_OUTPUT"
          else
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build Linux CLI candidate
        if: steps.binary_scope.outputs.affected == 'true'
        run: >-
          bun build packages/cli/src/linux-macos.ts --compile --target=bun-linux-x64
          --outfile "$RUNNER_TEMP/purr" --define "PURR_VERSION='dev-${GITHUB_SHA}'"

      - name: Test the actual CLI candidate
        if: steps.binary_scope.outputs.affected == 'true'
        env:
          PURR_TEST_BINARY: ${{ runner.temp }}/purr
        run: bun run test tests/cli/injective-cli-e2e.test.ts tests/cli/agentkey-cli.test.ts --maxWorkers=1 --minWorkers=1
